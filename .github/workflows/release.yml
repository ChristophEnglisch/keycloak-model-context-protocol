name: Release

# release-please opens/updates a release PR from Conventional Commits on main.
# Merging that PR creates the tag + GitHub release; the jobs below then publish
# to npm (Trusted Publishing / OIDC, no NPM_TOKEN) and to the MCP Registry.
# See docs/release-process.md. The npm Trusted Publisher on npmjs.com is bound
# to THIS file name (release.yml) and the environment "release" - do not rename.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional: a fine-grained PAT or GitHub App token (contents + pull requests: write).
          # Release PRs opened with the default GITHUB_TOKEN do not trigger the CI workflow.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (required for Trusted Publishing)
        run: |
          current="$(npm --version)"
          echo "npm $current (node $(node --version))"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@latest
            echo "upgraded to npm $(npm --version)"
          fi
      - name: Check tag matches package.json
        env:
          EXPECTED: ${{ needs.release-please.outputs.version }}
        run: |
          actual="$(node -p "require('./package.json').version")"
          test "$actual" = "$EXPECTED" || { echo "package.json $actual != release $EXPECTED"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Publish (OIDC, no token)
        run: npm publish --provenance --access public --ignore-scripts

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release-please, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC login for mcp-publisher
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628 # mcp-publisher_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
