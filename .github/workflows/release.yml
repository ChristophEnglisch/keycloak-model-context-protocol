name: Release

# release-please opens/updates a release PR from Conventional Commits on main.
# Merging that PR creates the tag + GitHub release; the jobs below then publish
# to npm (Trusted Publishing / OIDC, no NPM_TOKEN) and to the MCP Registry.
# A manual run (workflow_dispatch) skips release-please and publishes an existing
# release tag again, e.g. after a failed publish job.
# The npm Trusted Publisher on npmjs.com is bound
# to THIS file name (release.yml) and the environment "release" - do not rename.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please acts with a short-lived GitHub App token, not the GITHUB_TOKEN:
    # release PRs then trigger CI, and the repository setting "Allow GitHub Actions
    # to create and approve pull requests" can stay off.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Check release app configuration
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Release app not configured: set variable RELEASE_APP_CLIENT_ID and secret RELEASE_APP_PRIVATE_KEY."
            exit 1
          fi
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish to npm
    needs: release-please
    # !cancelled(): on a manual run release-please is skipped, which would otherwise skip this job too.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag '$TAG' (expected vX.Y.Z)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (required for Trusted Publishing)
        run: |
          current="$(npm --version)"
          echo "npm $current (node $(node --version))"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@latest
            echo "upgraded to npm $(npm --version)"
          fi
      - name: Check tag matches package.json
        run: |
          EXPECTED="${TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          test "$actual" = "$EXPECTED" || { echo "package.json $actual != release $EXPECTED"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      # npm swallows a failed OIDC token exchange (it is only logged at "verbose")
      # and then publishes without auth, which the registry answers with E404.
      # --loglevel verbose makes the registry's reason ("oidc ... Failed token
      # exchange request with body message: ...") visible in the job log.
      - name: Publish (OIDC, no token)
        run: npm publish --provenance --access public --ignore-scripts --loglevel verbose

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release-please, publish-npm]
    if: ${{ !cancelled() && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC login for mcp-publisher
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628 # mcp-publisher_linux_amd64.tar.gz
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The MCP Registry validates the npm package version, but a fresh npm publish
      # needs a moment to show up there (1.0.0 and 1.0.2 both failed with a 404).
      - name: Wait until the version is visible on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null -H "Cache-Control: no-cache" "https://registry.npmjs.org/${name}/${version}"; then
              echo "${name}@${version} is visible on npm (attempt ${attempt})."
              exit 0
            fi
            echo "${name}@${version} not visible on npm yet (attempt ${attempt}/30), waiting 10s."
            sleep 10
          done
          echo "::error::${name}@${version} did not appear on npm within 5 minutes."
          exit 1
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
